name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub occasionally takes a few seconds to index newly uploaded
      # artifacts; deploy-pages otherwise reports "No artifacts found".
      - name: Allow Pages artifact to become available
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4